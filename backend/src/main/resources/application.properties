# Smart Campus Management System - Application Configuration
# Server Port: supports Render/Railway/Heroku dynamic $PORT environment variable, defaults to 8080
server.port=${PORT:8080}

# Database Configuration:
# Defaults to in-memory H2 (zero configuration setup, ready out of the box).
# For production database on Render (MySQL or PostgreSQL), override via environment variables:
#   SPRING_DATASOURCE_URL
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
#   SPRING_DATASOURCE_DRIVER_CLASS_NAME (optional, auto-detected)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:smart_campus_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sathwik@2006}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# CORS Configuration:
# Comma-separated list of allowed origins or origin patterns (supports wildcard *.vercel.app)
# Override in Render environment variables with your Vercel production domain:
# e.g. ALLOWED_ORIGINS=https://my-app.vercel.app,http://localhost:5173
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://localhost:4173,https://*.vercel.app}

# JWT Security
app.jwt.secret=${JWT_SECRET:9a3b8e7c2d1f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.attendance.threshold-percentage=75.0

# Initial Seed Admin Account
app.init.admin.email=${ADMIN_EMAIL:campus.admin@smartcampus.edu}
app.init.admin.password=${ADMIN_PASSWORD:Campus#2026!}
app.init.admin.name=${ADMIN_NAME:Campus Administrator}
